[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koopman-lusi"
version = "0.1.0"
description = "A Physics-Informed, Statistical-Invariant Neural Architecture for Few-Shot and Cross-Subject Motor Imagery Brain-Computer Interfaces"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Chayse Wright" }
]
keywords = [
    "brain-computer interface",
    "bci",
    "eeg",
    "koopman operator",
    "vapnik lusi",
    "few-shot learning",
    "deep learning",
    "motor imagery"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.23.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "moabb>=1.0.0",
    "mne>=1.5.0",
    "pyriemann>=0.5",
    "matplotlib>=3.7.0",
    "pandas>=1.5.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["koopman_lusi*"]
